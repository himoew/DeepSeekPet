<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Fish Deskpet · 她</title>
<style>
  /* 和 voice.html 同一套变量：这几个窗口是一家人，配色别各自发明一套 */
  :root {
    --bg: #11151d; --panel: #1a202b; --panel2: #212836; --line: #2c3542;
    --fg: #e6ebf2; --dim: #8b97a8; --accent: #4d9fff; --ok: #46c98b; --warn: #e8b64c; --bad: #ef6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    padding: 18px 20px 96px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 16px; }

  .banner {
    border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .banner.bad { border-color: #5a2a2a; background: #2a1a1a; color: #ffc9c9; }
  .banner:empty { display: none; }

  .card {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card h2 {
    font-size: 14.5px; margin: 0 0 2px; display: flex; align-items: baseline; gap: 8px;
    flex-wrap: wrap; font-weight: 600;
  }
  .card h2 .hint { color: var(--dim); font-size: 12px; font-weight: 400; }
  .sect-note { color: var(--dim); font-size: 12.5px; margin: 2px 0 10px; }

  /* 状态条：左边四个数，右边结果 + 两个按钮；结果紧挨着按钮，别跑到下一行去 */
  .statcard { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .statline { font-size: 13px; color: #cfd8e3; }
  .statline b { color: var(--fg); font-weight: 600; }
  .statline .dot { color: #3d4a5c; margin: 0 6px; }
  .jres { font-size: 12.5px; color: var(--dim); }
  .jres.ok { color: var(--ok); }
  .jres.bad { color: var(--bad); }
  .btns { display: flex; gap: 8px; margin-left: auto; }

  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #3d4a5c; background: #262e3d; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #1d4b86; border-color: #2b6ab8; }
  button.primary:hover:not(:disabled) { background: #235a9e; }

  /* 一条一条的账：claim 占满，来源/次数/日期靠右，最后一个小 × */
  .group { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 9px; }
  .group:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .group h3 {
    font-size: 12.5px; color: var(--dim); margin: 0 0 4px;
    font-weight: 600; letter-spacing: .02em;
  }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #232b37; }
  .item:last-child { border-bottom: 0; }
  .claim { flex: 1; word-break: break-word; }
  .meta { color: #6f7889; font-size: 11.5px; white-space: nowrap; padding-top: 1px; }
  .item.retired .claim { color: #6f7889; text-decoration: line-through; }
  .del {
    background: transparent; border: 0; color: #6f7889; cursor: pointer;
    padding: 0 4px; font-size: 15px; line-height: 1.2; border-radius: 4px;
  }
  .del:hover { color: var(--bad); background: transparent; }

  /* 证词：一行一句，时间用等宽字体，别让中文和数字挤在一起 */
  .ev { padding: 3px 0; font-size: 13px; }
  .ev .when { color: #6f7889; font-family: Consolas, monospace; font-size: 12px; margin-right: 6px; }
  .ev .flavor { color: #6f7889; font-size: 12px; }

  .empty { color: #6f7889; font-size: 13px; padding: 6px 0; }

  /* 「加一条」：下拉 + 一句话 + 加；放在账那张卡的末尾 */
  .addform {
    display: flex; gap: 8px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center;
  }
  .addform select, .addform input {
    background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  .addform input { flex: 1; min-width: 170px; }
  .formmsg { font-size: 12px; color: var(--dim); }
  .formmsg.bad { color: var(--bad); }

  /* 传：一篇一篇，正文保留换行（她在文件里就是一行一段） */
  .piece { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 9px; }
  .piece:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .piece h3 { font-size: 12.5px; color: var(--dim); margin: 0 0 4px; font-weight: 600; }
  .piece p { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px;
    background: rgba(17,21,29,.94); border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; backdrop-filter: blur(6px);
  }
  footer .file { color: var(--dim); font-size: 12.5px; }
  footer .file code { font-family: Consolas, monospace; color: #cfd8e3; }
  footer button { margin-left: auto; }
</style>
</head>
<body>
  <h1>她的账</h1>
  <div class="sub">这些是她自己攒的，不是设定。可以看、可以删、可以让她现在就写一笔。</div>

  <div id="banner"></div>

  <!-- 状态条：四个数 + 立即写一笔 / 打开文件夹。写的结果显示在按钮左边，别用弹窗打断翻账。 -->
  <section class="card statcard">
    <div class="statline" id="stat">载入中…</div>
    <div class="jres" id="jres"></div>
    <div class="btns">
      <button class="primary" id="judge" type="button">立即写一笔</button>
      <button id="openDir" type="button">打开文件夹</button>
    </div>
  </section>

  <!-- 锚：她认下的事。删一条 = 让她不再拿它当准绳（走 self:retire）。 -->
  <section class="card">
    <h2>锚 <span class="hint">她认下的事，几乎不改</span></h2>
    <div id="anchors"></div>
  </section>

  <!-- 账：按 kind 分组。retired 的留着看（灰 + 删除线），但不再给删除按钮。 -->
  <section class="card">
    <h2>账 <span class="hint">她喜欢的 / 她的看法 / 她干过的 / 她想做的 / 她变过的</span></h2>
    <div id="ledger"></div>
    <form class="addform" id="addform">
      <select id="addkind">
        <option value="taste">我喜欢的</option>
        <option value="stance">我的看法</option>
        <option value="doing">我干过的</option>
        <option value="want">我还没做的</option>
        <option value="change">我变过的</option>
      </select>
      <input id="addclaim" type="text" maxlength="120" placeholder="用一句话写下……" autocomplete="off">
      <button class="primary" type="submit">加</button>
      <span class="formmsg" id="formmsg"></span>
    </form>
  </section>

  <!-- 证词：她说过但还没被收进账的话，最近 40 条。 -->
  <section class="card">
    <h2>证词 <span class="hint">她说过、但还没被收进账的话</span></h2>
    <div id="evidence"></div>
  </section>

  <!-- 她想的：一个词，一眼一件。这里只"看/删/让她现在想一个"，想象本身不进记忆。 -->
  <section class="card">
    <h2>她想的 <span class="hint">一个词，一眼一件；想过的不会变成记忆</span></h2>
    <div class="sect-note">浓度是数出来的（添了几件、换过几个通道、有没有"刚才记错了"）。不理它会淡，淡了只剩一句印象。</div>
    <div id="imagine"></div>
    <form class="addform" id="imform">
      <input id="imseed" type="text" maxlength="4" placeholder="给她一个词（比如：猫）" autocomplete="off">
      <button class="primary" type="submit">让她想一个</button>
      <span class="formmsg" id="immsg"></span>
    </form>
  </section>

  <!-- 传：她自己写的这一周（最近 6 篇）。 -->
  <section class="card">
    <h2>传 <span class="hint">她自己写的这一周</span></h2>
    <div id="chronicle"></div>
  </section>

  <footer>
    <span class="file">指向的文件：<code>ledger.jsonl</code></span>
    <button id="close" type="button">关闭</button>
  </footer>

<script>
  /**
   * 「她」窗口的全部逻辑。刻意保持成"一看就懂"的一页：
   *   · 只通过 preload 暴露的 window.her 走 IPC，碰不到文件系统；
   *   · 所有字段都可能缺（旧账、主进程还没写满），一律 `?? []` / `?? 0` 兜底；
   *   · 用户写进来的话一律 textContent / esc()，不拼裸 HTML。
   */
  const api = window.her || null;

  /** 账的 kind → 人话。没列到的（比如以后新加的）原样显示，别把条目吞掉。 */
  const KIND_LABEL = {
    taste: '我喜欢的',
    stance: '我的看法',
    doing: '我干过的',
    want: '我还没做的',
    change: '我变过的',
  };
  const KIND_ORDER = ['taste', 'stance', 'doing', 'want', 'change'];

  /** 来源 → 人话；和 `companion-self-kernel.cjs` 的 SOURCE_CN 对齐，没见过的原样显示。 */
  const SOURCE_LABEL = {
    intrinsic: '自己撞见',
    exposure: '他带的',
    accommodation: '迁就的',
    behavior: '她自己的行为',
    her: '她说的',
    curator: '写的一笔',
    manual: '手动',
  };

  const $ = (id) => document.getElementById(id);
  const arr = (v) => (Array.isArray(v) ? v : []);
  const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
  /** 结果里的计数：可能是数字，也可能是她写回来的一串条目 —— 两种都算得出来。 */
  const cnt = (v) => (Array.isArray(v) ? v.length : num(v));
  const ms = (v) => {
    const n = Number(v);
    return Number.isFinite(n) && n > 0 ? n : 0;
  };

  function esc(text) {
    return String(text ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /** 毫秒 → MM-DD（本地时区）。没有时间就返回空串，页面上不要出现 "NaN-NaN"。 */
  function fmtMD(at) {
    const t = ms(at);
    if (!t) return '';
    const d = new Date(t);
    return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  /** 毫秒 → MM-DD HH:mm。 */
  function fmtMDHM(at) {
    const t = ms(at);
    if (!t) return '';
    const d = new Date(t);
    return `${fmtMD(t)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  /** 「她想的」：浓度 → 人话（和 `companion-imagine.cjs` 的 LEVEL_CN 对齐，未知的兜底）。 */
  const LEVEL_LABEL = ['L0 一个影子', 'L1 有形状了', 'L2 立体了', 'L3 活的'];

  /** 锚到底算哪一类：主进程可能单独给 `anchors`，也可能混在 `ledger` 里（kind=anchor）。 */
  function isAnchor(entry) {
    return entry?.kind === 'anchor' || entry?.kind === '锚' || entry?.anchor === true;
  }

  function setBanner(text, bad = false) {
    const el = $('banner');
    el.textContent = text || '';
    el.className = `banner${bad ? ' bad' : ''}`;
  }

  function renderStat(state, anchors, entries, evidence, imagineActive) {
    const judgeCount = num(state?.judgeCount);
    const lastAt = ms(state?.lastJudgeAt);
    const title = lastAt ? `上次写：${fmtMDHM(lastAt)}` : '还没写过';
    $('stat').innerHTML = [
      `锚 <b>${anchors.length}</b> 条`,
      `账 <b>${entries.length}</b> 条`,
      `证词 <b>${evidence.length}</b> 条`,
      `想的 <b>${arr(imagineActive).length}</b> 张`,
      `已写 <b title="${esc(title)}">${judgeCount}</b> 次`,
    ].join(' <span class="dot">·</span> ');
  }

  function renderAnchors(anchors) {
    const box = $('anchors');
    if (!anchors.length) {
      box.innerHTML = '<div class="empty">她还没认下什么事。等她说过、再攒到够，才会钉成锚。</div>';
      return;
    }
    box.innerHTML = anchors.map((e) => {
      const id = esc(e?.id ?? '');
      const when = fmtMD(e?.firstAt);
      const retired = e?.status === 'retired' || e?.retired === true || ms(e?.retiredAt) > 0;
      return `<div class="item${retired ? ' retired' : ''}">
        <span class="claim">${esc(e?.claim ?? e?.text ?? '')}</span>
        ${when ? `<span class="meta">${when}</span>` : ''}
        ${retired ? '' : `<button class="del" type="button" title="不再拿这条当准绳" data-retire="${id}">×</button>`}
      </div>`;
    }).join('');
  }

  function renderLedger(entries) {
    const box = $('ledger');
    if (!entries.length) {
      box.innerHTML = '<div class="empty">还没有。她的账要等她说过、再攒到够，才会写进来。</div>';
      return;
    }
    /**
     * 按 kind 分组。排序固定（taste→change），以后的未知 kind 排在最后原样显示 ——
     * 这样主进程加新 kind 时页面不会把它藏起来。
     */
    const groups = new Map();
    for (const e of entries) {
      const kind = String(e?.kind || 'taste');
      if (!groups.has(kind)) groups.set(kind, []);
      groups.get(kind).push(e);
    }
    const order = [...KIND_ORDER.filter((k) => groups.has(k)), ...[...groups.keys()].filter((k) => !KIND_ORDER.includes(k))];
    box.innerHTML = order.map((kind) => {
      const rows = groups.get(kind).map((e) => {
        // retired 的三种写法都认（status / 布尔 / 有 retiredAt），免得账里明明标了却还显示删除按钮
        const retired = e?.status === 'retired' || e?.retired === true || ms(e?.retiredAt) > 0;
        const source = SOURCE_LABEL[e?.source] ?? (e?.source || '');
        const count = num(e?.count) || 1;
        const when = fmtMD(e?.lastAt);
        const meta = [source, count > 1 ? `出现 ${count} 次` : '', when].filter(Boolean).join(' · ');
        return `<div class="item${retired ? ' retired' : ''}">
          <span class="claim">${esc(e?.claim ?? '')}</span>
          ${meta ? `<span class="meta">${esc(meta)}</span>` : ''}
          ${retired ? '' : `<button class="del" type="button" title="从账里删掉（她还能再写回来）" data-retire="${esc(e?.id ?? '')}">×</button>`}
        </div>`;
      }).join('');
      return `<div class="group"><h3>${esc(KIND_LABEL[kind] ?? kind)}</h3>${rows}</div>`;
    }).join('');
  }

  function renderEvidence(evidence) {
    const box = $('evidence');
    if (!evidence.length) {
      box.innerHTML = '<div class="empty">还没攒下什么。聊几句就有了。</div>';
      return;
    }
    // 主进程给的是新到旧还是旧到新都不管，这里按时间倒序取最近 40 条
    const recent = evidence.slice().sort((a, b) => ms(b?.at) - ms(a?.at)).slice(0, 40);
    box.innerHTML = recent.map((e) => {
      const when = fmtMDHM(e?.at);
      const flavor = String(e?.flavor ?? '').trim();
      const where = String(e?.where ?? '').trim();
      const tail = flavor ? `（当时：${esc(flavor)}）` : '';
      // where 不占正文（格式按定好的来），放进 title，想知道在哪聊的悬停看
      return `<div class="ev"${where ? ` title="在 ${esc(where)}"` : ''}>
        <span class="when">[${esc(when || '-- --')}]</span>她说：${esc(e?.said ?? e?.text ?? '')}<span class="flavor">${tail}</span>
      </div>`;
    }).join('');
  }

  function renderChronicle(chronicle) {
    const box = $('chronicle');
    if (!chronicle.length) {
      box.innerHTML = '<div class="empty">她还没写过。攒够了或者她想写的时候才有。</div>';
      return;
    }
    // 同样按时间倒序取最近 6 篇
    const recent = chronicle.slice().sort((a, b) => ms(b?.at) - ms(a?.at)).slice(0, 6);
    box.innerHTML = recent.map((p) => (
      `<div class="piece">
        <h3>${esc(String(p?.date || '').trim() || fmtMD(p?.at) || '-- --')}</h3>
        <p>${esc(p?.text ?? '')}</p>
      </div>`
    )).join('');
  }

  /**
   * 「她想的」：开着的几张 + 最近的（淡掉的 / 想完的）。
   *
   * ⚠️ 这里**只读**想象自己的文件（`imagine.jsonl`），不碰账。别在这张卡里写"记下来"——
   * 记忆膨胀（想过的被当成经历过的）正是这套机制要防的事。
   */
  function renderImagines(im) {
    const box = $('imagine');
    const active = arr(im?.active);
    const recent = arr(im?.recent);
    const STATUS_LABEL = { done: '想完了', faded: '淡了', gaveup: '没想出来', dropped: '删了' };

    const row = (r, live) => {
      const lines = arr(r?.lines).map((l) => `${esc(l?.label ?? '')}：${esc(l?.text ?? '')}`);
      const unsure = arr(r?.unsure).map((u) => `<span class="flavor">?：${esc(u)}</span>`);
      const lv = LEVEL_LABEL[Math.max(0, Math.min(3, num(r?.level)))] || `L${num(r?.level)}`;
      const when = fmtMDHM(r?.touchedAt || r?.at);
      const meta = [
        lv,
        `${num(r?.eyes)} 眼`,
        num(r?.revisions) ? `改过 ${num(r.revisions)} 处` : '',
        live ? '' : (STATUS_LABEL[r?.status] || ''),
        when,
      ].filter(Boolean).join(' · ');
      const impression = !lines.length && r?.impression
        ? `<div class="ev"><span class="flavor">剩下的是：${esc(r.impression)}</span></div>`
        : '';
      const body = lines.length ? `<div class="ev">${lines.join('<br>')}</div>` : '';
      const unsureLine = unsure.length ? `<div class="ev">${unsure.join('<br>')}</div>` : '';
      return `<div class="item">
        <div class="claim"><b>${esc(r?.seed ?? '')}</b>${body}${unsureLine}${impression}</div>
        <span class="meta">${esc(meta)}</span>
        ${live ? `<button class="del" type="button" title="删掉这张（她不会记得）" data-drop="${esc(r?.id ?? '')}">×</button>` : ''}
      </div>`;
    };

    if (!active.length && !recent.length) {
      box.innerHTML = '<div class="empty">她还没想过什么。跟她说「想象一下猫」，或者在这下面点「让她想一个」。</div>';
      return;
    }
    const blocks = [];
    if (active.length) {
      blocks.push(`<div class="group"><h3>现在脑子里开着的 ${active.length} 张</h3>${active.map((r) => row(r, true)).join('')}</div>`);
    }
    if (recent.length) {
      blocks.push(`<div class="group"><h3>最近的</h3>${recent.map((r) => row(r, false)).join('')}</div>`);
    }
    box.innerHTML = blocks.join('');
  }

  function render(data) {
    const state = data?.state || {};
    const ledger = arr(data?.ledger);
    const given = arr(data?.anchors);
    const anchorIds = new Set(given.map((a) => a?.id).filter(Boolean));
    /**
     * 锚的两种来源都认：主进程单独给 `anchors`（未来的形状）或者混在 `ledger` 里
     * （`kind: 'anchor'`）。两种都不在时，锚就是空的 —— 页面不猜。
     */
    const anchors = given.length ? given : ledger.filter(isAnchor);
    const entries = given.length
      ? ledger.filter((e) => !anchorIds.has(e?.id) && !isAnchor(e))
      : ledger.filter((e) => !isAnchor(e));
    const evidence = arr(data?.evidence);
    const imagine = data?.imagine || {};

    renderStat(state, anchors, entries, evidence, arr(imagine.active));
    renderAnchors(anchors);
    renderLedger(entries);
    renderEvidence(evidence);
    renderImagines(imagine);
    renderChronicle(arr(data?.chronicle));
  }

  async function load() {
    if (!api) {
      setBanner('这个窗口没接上主进程（self-preload.cjs 没加载），先关掉重开一次试试。', true);
      return;
    }
    try {
      const data = await api.load();
      if (!data || data.ok === false) {
        setBanner(`读不到她的账：${data?.error || '主进程没回话'}`, true);
        return;
      }
      setBanner('');
      render(data);
    } catch (err) {
      setBanner(`读不到她的账：${err?.message || err}`, true);
    }
  }

  /* 立即写一笔：按钮先变「写…」并禁用；回来按结果在状态条右侧说人话。 */
  async function judge() {
    if (!api) return;
    const btn = $('judge'), out = $('jres');
    btn.disabled = true;
    btn.textContent = '写…';
    out.textContent = '她正在想……';
    out.className = 'jres';
    try {
      const r = await api.judge();
      if (r?.ok === false) {
        // 内核的失败原因常放在 `why`（"正在写"/"模型没配好"/"bad-json"），不是 error
        out.textContent = `没写成：${r?.error || r?.why || '她说不出话'}`;
        out.className = 'jres bad';
        return;
      }
      /**
       * 内核回的是 `{ kept, stat: { added, revised, retired } }`（见 memory-scribe 的 judgeSelf），
       * 也顺手认 `added/changed` 这种更直白的写法，字段少一个都不会把"写了"说成"没写"。
       */
      const stat = r?.stat || {};
      const added = cnt(r?.added ?? stat.added ?? r?.written ?? r?.addedCount);
      const changed = cnt(r?.changed ?? r?.revised ?? stat.revised ?? r?.updated ?? r?.changedCount);
      const retired = cnt(r?.retired ?? stat.retired);
      const parts = [];
      if (added) parts.push(`加了 ${added} 条`);
      if (changed) parts.push(`改了 ${changed} 条`);
      if (retired) parts.push(`不算了 ${retired} 条`);
      if (parts.length) {
        out.textContent = parts.join('、');
        out.className = 'jres ok';
      } else {
        out.textContent = '这次没写（她说没想写的）';
        out.className = 'jres';
      }
      // 写没写成都重读一遍：她可能顺手改了别的（合并、retire），页面别拿着旧账
      await load();
    } catch (err) {
      out.textContent = `没写成：${err?.message || err}`;
      out.className = 'jres bad';
    } finally {
      btn.disabled = false;
      btn.textContent = '立即写一笔';
    }
  }

  /* 删一条：锚和账都走同一个 retire，主进程按 id 找。 */
  async function retire(id) {
    if (!api || !id) return;
    try {
      const r = await api.retire(id);
      // 主进程可能回 `why`（内核的原话）而不是 `error`，两个都认
      if (r && r.ok === false) setBanner(`没删掉：${r.error || r.why || '主进程没回话'}`, true);
      await load();
    } catch (err) {
      setBanner(`没删掉：${err?.message || err}`, true);
    }
  }

  /* 删一张想象：和 retire 分两条，别让 × 的语义混在一起 */
  async function dropImagine(id) {
    if (!api || !id) return;
    try {
      const r = await api.imagineDrop(id);
      if (r && r.ok === false) setBanner(`没删掉：${r.error || r.why || '主进程没回话'}`, true);
      await load();
    } catch (err) {
      setBanner(`没删掉：${err?.message || err}`, true);
    }
  }

  document.addEventListener('click', (e) => {
    const retireBtn = e.target.closest('[data-retire]');
    if (retireBtn) {
      e.preventDefault();
      retire(retireBtn.dataset.retire);
      return;
    }
    const dropBtn = e.target.closest('[data-drop]');
    if (dropBtn) {
      e.preventDefault();
      dropImagine(dropBtn.dataset.drop);
    }
  });

  $('judge').addEventListener('click', judge);
  $('openDir').addEventListener('click', () => api?.openDir());
  $('close').addEventListener('click', () => api?.close());

  /**
   * 「让她想一个」：真跑模型（1~2 眼约 3 秒），所以先禁按钮、给一句"她闭上眼睛了"。
   * 失败原因按内核的 `why` 翻成人话（`no-seed` / `cool` / `day-max` / `no-model`）。
   */
  $('imform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('imseed');
    const msg = $('immsg');
    const seed = input.value.trim();
    msg.className = 'formmsg';
    if (!seed) {
      msg.textContent = '先给她一个词（1~4 个字）';
      msg.classList.add('bad');
      input.focus();
      return;
    }
    if (!api) { msg.textContent = '这个窗口没接上主进程'; msg.classList.add('bad'); return; }
    const btn = e.target.querySelector('button[type="submit"]');
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = '想…';
    msg.textContent = '她闭上眼睛了……';
    const WHY = {
      'no-seed': '这不像一个词（1~4 个字）',
      cool: '同一个词刚想过，等半小时再来',
      'day-max': '今天想够了',
      'no-model': '模型没配好',
    };
    try {
      const r = await api.imagine(seed);
      if (r?.ok === false) {
        msg.textContent = `没想成：${WHY[r?.why] || r?.error || r?.why || '她说不出话'}`;
        msg.classList.add('bad');
        return;
      }
      const rec = r?.rec || {};
      const n = arr(rec.lines).length;
      msg.textContent = n
        ? `想出来了：${rec.seed || seed} · L${num(rec.level)} · ${n} 件`
        : '这次没想出来（她说"算了"）';
      input.value = '';
      await load();
    } catch (err) {
      msg.textContent = `没想成：${err?.message || err}`;
      msg.classList.add('bad');
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  });

  /* 加一条：空话不提交（不然账里会多一行空白）；成功就清空输入、整页重载。 */
  $('addform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const kind = $('addkind').value;
    const input = $('addclaim');
    const claim = input.value.trim();
    const msg = $('formmsg');
    msg.className = 'formmsg';
    if (!claim) {
      msg.textContent = '先写一句话再点「加」';
      msg.classList.add('bad');
      input.focus();
      return;
    }
    if (!api) { msg.textContent = '这个窗口没接上主进程'; msg.classList.add('bad'); return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const r = await api.add(kind, claim);
      if (r && r.ok === false) {
        msg.textContent = `没加上：${r.error || r.why || '主进程没回话'}`;
        msg.classList.add('bad');
        return;
      }
      input.value = '';
      msg.textContent = '加上了';
      await load();
    } catch (err) {
      msg.textContent = `没加上：${err?.message || err}`;
      msg.classList.add('bad');
    } finally {
      btn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
