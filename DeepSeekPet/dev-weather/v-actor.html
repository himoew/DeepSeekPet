<!doctype html>
<!--
  ============================================================================
  桌宠页面 · 天气与她的互动验收（临时工具，不进桌宠安装包）
  ============================================================================

  用途：**在真正的 `pet.html` 里**验第 ③ 项 ③a（雨打在她身上溅一圈 / 樱花落叶擦身 / 走动带风）。
  为什么非用它不可：自检那边是"在 Node 里真跑"，它证明不了**产品页里的她**（真 SVG、真变换、
  真帧循环）也把"她的盒子"喂进去了 —— 而这一项最容易静默失效的地方正是**喂错/没喂**：
  粒子照旧在飘，看起来一切正常，只是永远碰不到她。

  所以这一页做的是**从外面看**：
    ① 真的在驱动产品自己那条路（`petFx().drive()` = `pushActor(true)` + `fx.frame()`）；
    ② 她的盒子**与 `#pet` 的 svg 变换对得上**（解析 `translate/rotate/scale` 自己算一遍）；
    ③ 往她头顶正上方放一滴雨 → 命中数 + `onBody` + **近层画布上她身上那块真的有像素**，
       而**远层那块没有**（证明它被画在她**身前**，不是身后被挡掉）；
    ④ `fxbox=1` 那套盒子描边画的就是两个判定圆；
    ⑤ 不喂她（老的 `step()`）→ **一次身上溅落都没有**（这一套整体关闭）；
    ⑥ **雪（③b）**：落在她身上**积住**（近层画布她身上那块真的多了像素）、
       让她**真走两步**（`petFx().act('walk')`）→ 积雪**掉光**；
    ⑦ `clear(true)` 之后两张画布都空。

  ★ 打开：`node dev-weather\serve.cjs` → http://127.0.0.1:8899/v-actor.html
  ⚠️ 只读页面 + 驱动它自己的帧循环；不改产品代码、不写文件。
-->

<head>
<meta charset="utf-8">

<style>

<body>
<h1>桌宠页面 · 天气与她的互动验收 <small>iframe 里是真正的 <code>/pet</code></small></h1>
<p class="note">
  这一页会<b>往她头顶正上方放一滴雨</b>（不是等雨自己飘过来），然后数"她身上那块"在近层画布上
  有没有像素 —— 顺带把她的判定盒子画出来（<code>fxbox</code>）：盒子有没有对上她，不该靠猜。
</p>
<div class="row">
  <button id="rerun">重新自检</button>
  <span id="prog" style="color:#7f8ea3"></span>
</div>
<div id="out"></div>
<div id="log"></div>
<div id="stageBox"><iframe id="frame" src="/pet?diag=1"></iframe></div>

<script>
const $ = (id) => document.getElementById(id);
window.addEventListener('error', (e) => { $('log').textContent += `\n脚本错误：${e.message} @${e.lineno}`; });
window.addEventListener('unhandledrejection', (e) => { $('log').textContent += `\n未捕获：${(e.reason && e.reason.message) || e.reason}`; });

const frame = $('frame');
let doc = null, win = null, far = null, near = null;
const results = [];
const ok = (name, pass, detail) => results.push({ name, pass: !!pass, detail: detail == null ? '' : String(detail) });

function collect() {
  doc = frame.contentDocument; win = frame.contentWindow;
  if (!doc || !win) return false;
  far = doc.getElementById('fxCanvas');
  near = doc.getElementById('fxCanvasNear');
  return !!(far && near) && typeof win.petFx === 'function';
}

/** 数一块矩形里（CSS 坐标）的不透明像素。 */
function inkIn(canvas, x0, y0, x1, y1) {
  const d = (win.devicePixelRatio || 1);
  const g = canvas.getContext('2d');
  const w = Math.max(1, Math.round((x1 - x0) * d)), h = Math.max(1, Math.round((y1 - y0) * d));
  const data = g.getImageData(Math.round(x0 * d), Math.round(y0 * d), w, h).data;
  let n = 0;
  for (let i = 3; i < data.length; i += 4) if (data[i] > 10) n += 1;
  return n;
}

/** 解析 `#pet` 的 `translate(AX AY) rotate(R) scale(KX KY) translate(-ax -ay)`（`toStage` 的原始出处）。 */
function petTransform() {
  const g = doc.getElementById('pet');
  const s = g && g.getAttribute('transform');
  if (!s) return null;
  const num = (re) => { const m = re.exec(s); return m ? m.map(Number).slice(1) : null; };
  const t = num(/translate\(([-\d.]+) ([-\d.]+)\)/);
  const r = num(/rotate\(([-\d.]+)\)/);
  const k = num(/scale\(([-\d.]+) ([-\d.]+)\)/);
  const b = num(/translate\(([-\d.]+) ([-\d.]+)\)\s*$/);
  if (!t || !k) return null;
  /** ⚠️ 最后那段是 `translate(-ax -ay)` —— 里面是**负的锚点**，取出来要再取负，
   *  否则盒子会整体偏掉（第一版就踩了：偏 237px，看着像"她根本没动过"）。 */
  return { AX: t[0], AY: t[1], rot: r ? r[0] : 0, kx: k[0], ky: k[1], ax: b ? -b[0] : 128, ay: b ? -b[1] : 256 };
}
/** 用解析出来的变换手算"本地 → 舞台"（与 pet-core 的 `toStage` 同一个公式）。 */
function toStage(tf, lx, ly) {
  const r = tf.rot * Math.PI / 180;
  const dx = (lx - tf.ax) * tf.kx, dy = (ly - tf.ay) * tf.ky;
  return { x: tf.AX + dx * Math.cos(r) - dy * Math.sin(r), y: tf.AY + dx * Math.sin(r) + dy * Math.cos(r) };
}

function run() {
  results.length = 0;
  const api = win.petFx();

  /* ① 产品自己那条路真的在喂她 */
  const warm = api.drive('rain', .3);
  ok('① 驱动真的走了"喂她"那条路（`drive()` = pushActor + fx.frame）',
    !!warm.actor && warm.actor.on === true,
    `actor.on=${warm.actor && warm.actor.on} 身体 ${warm.actor ? warm.actor.c1.x.toFixed(0) + ',' + warm.actor.c1.y.toFixed(0) : 'n/a'}`);
  ok('① 她的盒子尺寸对得上体型（身体 r≈108×0.42=45px、下身 r≈26px，且下身圆心更低）',
    !!warm.actor && Math.abs(warm.actor.c1.r - 45.4) < 1.5 && Math.abs(warm.actor.c2.r - 26) < 1.5
      && warm.actor.c2.y > warm.actor.c1.y,
    warm.actor ? `身体 r=${warm.actor.c1.r.toFixed(1)} / 下身 r=${warm.actor.c2.r.toFixed(1)}` : 'n/a');

  /* ② 盒子与 `#pet` 的 svg 变换对得上（页面外面用同一套公式自己算一遍） */
  const tf = petTransform();
  let dmax = -1, at = '';
  if (tf) {
    const box = api.actor();
    const pairs = [[128, 128, box.c1], [128, 232, box.c2]];
    dmax = 0;
    for (const [lx, ly, want] of pairs) {
      const s = toStage(tf, lx, ly);
      const d = Math.hypot(want.x - s.x, want.y - s.y);
      if (d > dmax) { dmax = d; at = `本地(${lx},${ly})`; }
    }
  }
  ok('② 她的盒子与 `#pet` 的 svg 变换逐点一致（从页面外面手算，≤1px）',
    !!tf && dmax >= 0 && dmax < 1,
    tf ? `最差 ${dmax.toFixed(3)}px @ ${at} · svg translate(${tf.AX.toFixed(0)} ${tf.AY.toFixed(0)}) scale(${tf.kx.toFixed(3)} ${tf.ky.toFixed(3)}) rot=${tf.rot.toFixed(1)}` : '拿不到 #pet 的 transform');

  /* ②b 盒子描边（`fxbox`）：单独验，免得它的像素混进下面"她身上"的计数 */
  api.box(true);
  const boxed = api.drive('off', 1 / 30);
  api.box(false);
  ok('②b `fxbox` 打开时画的是"她被当成什么"（有真实轮廓 = 上下两条轮廓线，没有 = 两个判定圆）',
    boxed.boxDrawn === 2, `这一帧画了 ${boxed.boxDrawn} 笔（surfaceOn=${api.surfaceOn()}）`);

  /* ③ 往她头顶正上方放一滴雨：命中 + 身上溅落 + **近层她身上那块真有像素**（远层没有） */
  api.clear(true);
  const box = api.actor();
  const crown = { x: box.c1.x, y: box.c1.y - box.c1.r };
  const b0 = { x0: box.c1.x - box.c1.r, y0: box.c1.y - box.c1.r, x1: box.c1.x + box.c1.r, y1: box.c1.y + box.c1.r };
  const farBefore = inkIn(far, b0.x0, b0.y0, b0.x1, b0.y1), nearBefore = inkIn(near, b0.x0, b0.y0, b0.x1, b0.y1);
  const placed = api.at('rain', crown.x, crown.y - 70, { vy: 2000, vT: 2000, sway: 0, hz: 0, hzA: 0, phase: 0, wind: 0, slip: 0, layer: 1, layerN: 3 });
  let hits = 0, onBody = 0, nearMax = 0, farMax = 0;
  for (let i = 0; i < 14; i += 1) {                     // 每次 1/30 秒，共约 0.47 秒
    const r = api.drive('off', 1 / 30);                 // 'off' = 不再发射，"只有那一滴"
    hits = Math.max(hits, r.hits); onBody = Math.max(onBody, r.onBody);
    nearMax = Math.max(nearMax, inkIn(near, b0.x0, b0.y0, b0.x1, b0.y1));
    farMax = Math.max(farMax, inkIn(far, b0.x0, b0.y0, b0.x1, b0.y1));
  }
  ok('③ 雨**打在她身上**了（命中数 ≥1 且身上溅落 ≥1）',
    placed && hits >= 1 && onBody >= 1, `hits=${hits} onBody=${onBody} 粒子剩 ${api.counts().total}`);
  ok('③ 她身上那块在**近层画布**上真的有像素（所以看得见）',
    nearMax > nearBefore + 5, `近层 ${nearBefore} → ${nearMax}（她身上那块 ${Math.round(b0.x1 - b0.x0)}×${Math.round(b0.y1 - b0.y0)}）`);
  ok('③ 同一块在**远层画布**上没多出东西（她本来就靠远层挡住身后的雨雪）',
    farMax <= farBefore + 5, `远层 ${farBefore} → ${farMax}`);

  /* ④ 不喂她（老的那条路）：这一套整体关闭 */
  api.detach();
  api.clear(true);
  api.at('rain', crown.x, crown.y - 70, { vy: 2000, vT: 2000, sway: 0, hz: 0, hzA: 0, phase: 0, wind: 0, slip: 0, layer: 1, layerN: 3 });
  let offHits = 0, offBody = 0, offGround = 0;
  for (let i = 0; i < 14; i += 1) {
    api.step('off', 1 / 30);
    const m = api.stats().meta;
    offHits = Math.max(offHits, m.hits); offBody = Math.max(offBody, m.onBody); offGround = Math.max(offGround, m.splash);
  }
  ok('④ 不喂她时**一次命中都没有**、雨照旧溅在地上 —— 互动整体关闭，粒子行为同上一版',
    offHits === 0 && offBody === 0 && offGround >= 1, `hits=${offHits} onBody=${offBody} 地上 ${offGround}`);

  /* ⑤ 雪（③b）：落在她身上**积住** → 在近层画布她身上那块有像素；**她一走就抖掉** */
  {
    api.detach();
    api.clear(true);
    api.drive('off', 1 / 30);                            // 一帧：把 actor 挂回去 + 拿到盒子
    const box2 = api.actor();
    /**
     * ★ **真实轮廓接上了没有**（`whale/surface.json`）：接上之后雨雪落在的是**她画出来的形状**上，
     * 而不是那两个"点得到的圆"（实测：圆里有 23% 是空气、73.5% 的雪落点在她身外 —— 这就是
     * 用户报的"不同大小的白点"的根因）。这里看三个雪帽锚点在哪儿，雪只往**头顶那个锚点**上放。
     */
    const caps0 = api.caps();
    const headStage = { x: box2.c1.x, y: box2.c1.y - box2.c1.r };
    ok('⑤ 她的**真实轮廓**接上了（`surfaceOn` 为真，三个雪帽锚点都在她顶面上）',
      api.surfaceOn() === true && caps0.length === 3,
      `surfaceOn=${api.surfaceOn()} 锚点 ${caps0.map((a) => `${a.x},${a.y}`).join(' / ')}`);
    const capOn = () => api.at('snow', headStage.x, headStage.y - 60, { vy: 140, vT: 140, sway: 0, hz: 0, hzA: 0, phase: 0, wind: 0, slip: 0, stall: 0, spin: 0, spinSp: 0, rollSp: 0, layer: 1, layerN: 3, life: 40 });
    capOn();
    /** 她身上那块（用**两个圆的盒子**围出来一块区域，只用来数像素）。 */
    const r2 = { x0: box2.c1.x - box2.c1.r, y0: box2.c1.y - box2.c1.r, x1: box2.c1.x + box2.c1.r, y1: box2.c1.y + box2.c1.r };
    const nBefore = inkIn(near, r2.x0, r2.y0, r2.x1, r2.y1);
    let amtMax = 0, nearSnow = 0;
    for (let i = 0; i < 3; i += 1) {
      if (i) capOn();
      for (let k = 0; k < 30; k += 1) {
        const d = api.drive('off', 1 / 30);
        amtMax = Math.max(amtMax, (d && d.capAmt) || 0);
        nearSnow = Math.max(nearSnow, inkIn(near, r2.x0, r2.y0, r2.x1, r2.y1));
      }
    }
    ok('⑤ 雪落在头顶那个锚点上会**积起来**（雪量 > 0.5），而且近层画布她身上那块真的多了像素',
      api.cling() >= 1 && amtMax > .5 && nearSnow > nBefore + 3,
      `有雪的锚点 ${api.cling()} 个 · 雪量峰值 ${amtMax.toFixed(2)} · 近层 ${nBefore} → ${nearSnow}`);
    /** 让她**真的走两步**（`act('walk')` 走的是产品自己的动作系统）→ 雪帽应当抖掉。 */
    const walked = api.act('walk');
    let gone = false, drops = 0;
    for (let i = 0; i < 60; i += 1) {
      api.drive('off', 1 / 30);                          // 每帧走产品自己的 pushActor + fx.frame
      if (api.cling() === 0) { gone = true; drops = api.stats().n; break; }
    }
    ok('⑤ 她一**走动**，雪帽就抖掉（而且掉成一粒粒雪，不是凭空消失）',
      walked !== false && gone, `act('walk')=${walked} 抖掉后还有雪的锚点 ${api.cling()} 个 · 画了 ${drops} 个形状`);

    /**
     * ⑤c ★★ **在页面上量几何：一枚雪形状都不许画进她的身体里。**
     *
     * 用户实测报的是"左右两边的积雪互相连的时候，那条线直接穿过了桌宠的脑袋"（老版：两顶雪的锚点
     * 之间补了一条**直线**）。自检里已经钉了"跨锚点那两段里没有形状"，但那是在 Node 的假画布上；
     * 这里用**真页面**再量一遍，判据是**绝对的**（不是相对上一次的差）：
     *
     *   每一枚雪形状（`cap` 笔触 / `band` 上缘描边与接地阴影）回到她的**本地坐标**后，
     *   它的中心必须**落在她那条轮廓线 `top(x)` 附近**（容差 2.6 本地单位 ≈ 1.1px；
     *   实测最靠下的一枚 +1.19 单位，就是贴着轮廓画的那条接地阴影）。
     *
     * 这条真能抓到老版：那条线在本地坐标里从 y≈23 **一路斜到 y≈100**（穿过她脸的深处），
     * 远大于 2.6 —— 而现在每个锚点只画自己那一段，跨锚点的地方根本没有形状。
     *
     * ⚠️ **动手之前必须让她站住**：她一旦被 `act('walk')` 叫起来，会**一直走到目标点**才回 idle，
     * 而产品规定"走路时不积雪"（`fx.js` 的 `busy = A.moving || …`）。第一版没等她站住就往下量 →
     * 9 片雪全部只冒白雾、一枚都没积（实测 `0 枚雪形状`，而我误以为是几何坏了）。
     */
    api.clear(true);
    /**
     * ⚠️ **先让她停下来，而且要在放雪的那一刻再确认一次位置**。
     *
     * 她走完一段会**立刻决定去下一处**，所以"连续几帧没动"不等于"接下来还会站着"。
     * 第一版就是因为这个出错：量的时候她还在溜达（产品规定"走路时不积雪"，
     * `busy = A.moving || …`），9 片雪全部只冒白雾、一枚都没积 —— 而"实测"那一列
     * 只显示 `0 枚雪形状`，看着像几何坏了。诊断（临时给 `at()` 包一层）证明每一片
     * 都 `hits=1`、落点换算回本地正是 128 / 72 / 186（也就是判定没问题，是**时机**问题）。
     */
    api.act('stand');
    for (let i = 0; i < 90; i += 1) api.drive('off', 1 / 30);
    for (const a of api.caps()) {
      for (let k = 0; k < 3; k += 1) {
        /**
         * 放**刚好压在轮廓上**（`a.y + 1` = 轮廓线下方一点），不是"上方 24 单位"：
         * 锚点的 `y` 就是她头顶最上面那一列（本地 y=23），上方 24 单位 = 屏幕外 10px，
         * 粒子要落 2.3 秒才碰到她，而那 2.3 秒里已经积起来的雪同时在化（20 秒寿命）。
         *
         * ⚠️ 坐标在**放的这一刻**现取（`api.stage` 用的是她当前的变换）：先取后放，
         * 中间只要她动一帧，雪就落在原地、她已经走开了。
         */
        const s = api.stage(a.x, a.y + 1);
        if (Math.abs(s.y - api.stage(128, 24).y) > 400) continue;      // 她已经不在视口里，跳过
        api.at('snow', s.x, s.y, { vy: 140, vT: 140, sway: 0, hz: 0, hzA: 0, phase: 0, wind: 0, slip: 0, stall: 0, spin: 0, spinSp: 0, rollSp: 0, layer: 1, layerN: 3, life: 40 });
        for (let i = 0; i < 12; i += 1) api.drive('off', 1 / 30);
      }
    }
    const snowItems = api.stats().list.filter((q) => q.kind === 'snow');
    let inBody = 0, worstItem = '', offEdge = 0;
    const TOL = 2.6;
    for (const q of snowItems) {
      const l = api.local(q.x, q.y);
      const tp = api.top(l.x);
      if (!Number.isFinite(tp)) { offEdge += 1; continue; }        // 落在"她没有内容"的列上（不该有）
      const below = l.y - tp;                                       // >0 = 低于轮廓 = 画进她身体里
      if (below > TOL) { inBody += 1; worstItem = `${q.shape} 本地(${l.x.toFixed(0)},${l.y.toFixed(0)}) 轮廓 y=${tp.toFixed(0)} → 低了 ${below.toFixed(1)}`; }
    }
    ok('⑤c ★（真页面量几何）三顶雪**一枚都没有画进她身体里** —— 也就是没有东西横穿她的脑袋',
      snowItems.length >= 20 && inBody === 0 && offEdge === 0,
      `${snowItems.length} 枚雪形状 · 扎进身体 ${inBody} 枚${worstItem ? `（${worstItem}）` : ''} · 落在轮廓外 ${offEdge} 枚`);
  }

  /* ⑥ 收拾干净 */
  api.box(false);
  api.clear(true);
  ok('⑥ `clear(true)` 之后两张画布都空了',
    inkIn(far, 0, 0, win.innerWidth, win.innerHeight) === 0 && inkIn(near, 0, 0, win.innerWidth, win.innerHeight) === 0,
    `far=${inkIn(far, 0, 0, win.innerWidth, win.innerHeight)} near=${inkIn(near, 0, 0, win.innerWidth, win.innerHeight)}`);

  globalThis.__vactor = { results, bad: results.filter((r) => !r.pass).length };
  paint();
}
function paint() {
  let html = '<table><tr><th>检查项</th><th>结论</th><th>实测</th></tr>';
  for (const r of results) {
    html += `<tr><td>${r.name}</td><td class="${r.pass ? 'ok' : 'bad'}">${r.pass ? 'PASS' : 'FAIL'}</td><td>${r.detail}</td></tr>`;
  }
  html += '</table>';
  const bad = results.filter((r) => !r.pass).length;
  html += bad === 0
    ? '<p class="note" style="color:#7ee0a8"><b>全部通过</b> —— 产品页里她确实"在场"，雨打在她身上、画在她身前。</p>'
    : `<p class="note" style="color:#ff8a8a"><b>${bad} 项 FAIL</b> —— 看「实测」那一列。</p>`;
  $('out').innerHTML = html;
}

$('rerun').addEventListener('click', () => { results.length = 0; try { run(); } catch (e) { $('log').textContent += `\n自检抛错：${e && e.stack}`; } });
frame.addEventListener('load', () => {
  $('log').textContent = 'iframe 已加载，等 2 秒让她的帧循环和形象就绪…';
  $('prog').textContent = '等一下…';
  setTimeout(() => {
    try {
      if (!collect()) { $('out').innerHTML = '<p style="color:#ff8a8a">拿不到 iframe 里的画布（或 petFx 没暴露 —— 检查 iframe 的 URL 有没有 <code>?diag=1</code>）</p>'; return; }
      run();
      $('prog').textContent = `自检完成 · ${new Date().toLocaleTimeString()}`;
      $('log').textContent += '\n数据取自真实 /pet 页面；驱动走的是产品自己的 pushActor() + fx.frame()。';
    } catch (e) {
      $('log').textContent += `\n自检抛错：${e && e.stack}`;
      $('prog').textContent = '自检抛错（见下面日志）';
    }
  }, 2000);
});
</script>
