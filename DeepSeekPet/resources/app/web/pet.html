<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Fish Deskpet</title>
<link rel="stylesheet" href="/web/pet.css">
</head>
<body>
<div class="floor" aria-hidden="true"></div>
<div class="stage" id="stage">
  <svg id="stageSvg" aria-hidden="true">
    <defs>
      <!-- a soft light gray glow behind the body, for backdrops of the body's own color -->
      <filter id="halo" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown"/>
        <feGaussianBlur in="grown" stdDeviation="7" result="soft"/>
        <feFlood id="haloFlood" flood-color="#B8B8B8" flood-opacity="0"/>
        <feComposite in2="soft" operator="in" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <ellipse id="shadow" class="shadow" cx="0" cy="0" rx="0" ry="0"/>
    <g id="pet"></g>
    <!-- #fx 是"特效那一层"：#fxCore 装她的粒子（爱心/z/眼泪/灰尘，pet-core 会整层重写它），
         其余子节点留给别的绘制者（玩具球就挂在这里），**互不干扰** -->
    <g id="fx"><g id="fxCore"></g></g>
  </svg>
</div>
<div class="trail" id="trail" hidden aria-hidden="true"><i></i><i></i><i></i></div>
<!-- 进球时窗口四边内圈发光（比赛模式，见 pet-app.js 的 goalGlow 与 pet.css） -->
<div id="goalGlow" aria-hidden="true"></div>
<div class="bubble heard" id="heard" role="status" aria-live="polite" hidden></div>
<div class="bubble" id="bubble" role="status" aria-live="polite" hidden></div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="tools" id="tools" hidden></div>
<script type="module" src="/web/pet-app.js"></script>
<script>
  /**
   * 页面自检自报（`?diag=1` 时打开，平时完全不跑）。
   *
   * **为什么需要**：主进程的 `console.log` 在 GUI 起来之后是被丢掉的，而页面里的异常
   * 又不会自己冒出来——"她没画出来"这类问题因此完全没有线索。这段代码把"页面到底画了
   * 什么"持续写进 `document.title`，于是**从窗口外面**（Get-Process / user32 读标题）
   * 就能看到：SVG 里有没有内容、canvas 多大、有没有 WebGL、有没有 JS 异常。
   */
  if (new URLSearchParams(location.search).get('diag') === '1') {
    const report = (tag) => {
      const petG = document.getElementById('pet');
      const svg = document.getElementById('stageSvg');
      const r = svg ? svg.getBoundingClientRect() : null;
      const cs = [...document.querySelectorAll('canvas')].map((c) => {
        const b = c.getBoundingClientRect();
        return `${c.width}x${c.height}@${Math.round(b.x)},${Math.round(b.y)}:${Math.round(b.width)}x${Math.round(b.height)}`;
      });
      // ⚠️ 探针**不要每秒新建一个 canvas 再要一个 WebGL 上下文**：Chromium 每页只给约 16 个
      // 活动上下文（见 rig/rig.js 的 dispose 注释），这个自检本身会把它耗光 ——
      // 于是读出来的 `GLNONE` 反而是**自检造成的假象**（排查时最误导人的一种）。
      // 现在只复用页面里已有的那块 canvas：它已经有 webgl2 上下文，`getContext` 只会把它取回来。
      let gl = 'GLNONE';
      try {
        const c = document.querySelector('#pet canvas');
        const ctx = c && c.getContext('webgl2');
        gl = !ctx ? 'GLNONE' : (ctx.isContextLost() ? 'gl2:LOST' : 'gl2');
      } catch (e) { gl = 'glthrow'; }
      document.title = `DIAG ${tag} ready=${document.readyState} kids=${petG ? petG.childElementCount : -1}`
        + ` inner=${petG ? petG.innerHTML.length : -1} tf=${petG ? petG.getAttribute('transform') : null}`
        + ` svg=${r ? [r.x, r.y, r.width, r.height].map(Math.round).join(',') : null}`
        + ` canvas=[${cs.join(' ')}] ${gl}`;
    };
    window.addEventListener('error', (e) => report(`ERR ${e.message}@${e.lineno}`));
    window.addEventListener('unhandledrejection', (e) => report(`REJ ${(e.reason && (e.reason.stack || e.reason.message)) || e.reason}`));
    setInterval(() => report('T'), 1000);
  }
</script>
</body>
</html>
